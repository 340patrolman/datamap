<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>데이터 압축지도 사용설명서</title>
<style>
  :root { --bg: #f4f6fa; --panel: #fff; --ink: #0f172a; --ink2: #475569; --line: #e2e8f0; --acc: #1d4ed8; --acc2: #eff6ff; --chip: #f1f5f9; --ok: #15803d; --warn: #b45309; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0b1220; --panel: #121b2e; --ink: #e5edf8; --ink2: #9fb0c8; --line: #24314a; --acc: #7cb5fb; --acc2: #172442; --chip: #1a2540; --ok: #4ade80; --warn: #fbbf24; } }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.6 system-ui, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
  header { position: sticky; top: 0; z-index: 5; background: var(--panel); border-bottom: 1px solid var(--line); padding: 10px 16px calc(10px); }
  .hd { display: flex; align-items: center; gap: 10px; max-width: 1100px; margin: 0 auto; }
  .hd h1 { font-size: 18px; margin: 0; flex: 1; } .hd a { color: var(--acc); font-weight: 800; text-decoration: none; white-space: nowrap; }
  .sr { max-width: 1100px; margin: 8px auto 0; display: flex; gap: 8px; }
  .sr input { flex: 1; font-size: 16px; padding: 10px 12px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--bg); color: var(--ink); }
  nav { max-width: 1100px; margin: 8px auto 0; display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; } nav::-webkit-scrollbar { display: none; }
  nav a { flex: 0 0 auto; padding: 6px 12px; border-radius: 999px; background: var(--chip); color: var(--ink); text-decoration: none; font-weight: 700; font-size: 13.5px; }
  main { max-width: 1100px; margin: 0 auto; padding: 12px 16px 60px; }
  section { margin-top: 22px; } h2 { font-size: 19px; margin: 0 0 4px; } .lead { color: var(--ink2); margin: 0 0 12px; font-size: 14px; }
  .kpi { display: flex; gap: 8px; flex-wrap: wrap; margin: 8px 0 4px; } .kpi span { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 8px 12px; } .kpi b { font-size: 20px; display: block; line-height: 1.1; } .kpi small { color: var(--ink2); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 10px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; }
  .card h3 { margin: 0 0 4px; font-size: 16px; display: flex; gap: 8px; align-items: center; } .card h3 .ic { font-size: 22px; }
  .card p { margin: 4px 0; font-size: 14px; }
  .path { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; margin: 6px 0 2px; font-size: 12.5px; }
  .path i { font-style: normal; background: var(--acc2); color: var(--acc); padding: 2px 8px; border-radius: 999px; font-weight: 700; } .path u { text-decoration: none; color: var(--ink2); }
  .go { display: inline-block; margin-top: 6px; font-size: 13px; font-weight: 800; color: var(--acc); text-decoration: none; }
  .tabs { display: flex; gap: 6px; flex-wrap: wrap; margin: 6px 0 10px; } .tabs button { border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 999px; padding: 6px 12px; font-size: 14px; font-weight: 700; cursor: pointer; } .tabs button.on { background: var(--acc); color: #fff; border-color: var(--acc); }
  .grp { margin: 14px 0 6px; font-weight: 800; font-size: 16px; } .sub { margin: 10px 0 6px; font-size: 13px; font-weight: 800; color: var(--ink2); }
  .ly h3 { font-size: 15px; } .badge { font-size: 11.5px; font-weight: 800; padding: 1px 7px; border-radius: 999px; background: #dcfce7; color: #166534; } .badge.no { background: #fef3c7; color: #92400e; }
  .ly .ds { color: var(--ink); } .ly .ds.none { color: var(--warn); font-size: 13px; }
  details.file { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 8px 12px; margin: 6px 0; }
  details.file summary { cursor: pointer; font-weight: 700; font-size: 14px; list-style: none; } details.file summary::after { content: ' ▼'; color: var(--ink2); font-size: 11px; } details.file[open] summary::after { content: ' ▲'; }
  details.file .sz { color: var(--ink2); font-weight: 400; font-size: 12px; } details.file p { margin: 6px 0; font-size: 13.5px; } details.file b { color: var(--ink2); font-size: 12.5px; }
  .flow { display: flex; flex-wrap: wrap; gap: 8px; align-items: stretch; } .flow .st { flex: 1 1 170px; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px; position: relative; }
  .flow .st b { display: block; font-size: 15px; } .flow .st small { color: var(--ink2); font-size: 13px; } .flow .ar { align-self: center; font-size: 20px; color: var(--ink2); }
  ul.rule { margin: 8px 0; padding-left: 20px; } ul.rule li { margin: 4px 0; font-size: 14px; }
  table.spec { width: 100%; border-collapse: collapse; font-size: 15px; } table.spec th { text-align: left; white-space: nowrap; vertical-align: top; padding: 9px 12px 9px 0; color: var(--ink2); width: 7.5em; } table.spec td { padding: 9px 0; line-height: 1.6; } table.spec tr + tr th, table.spec tr + tr td { border-top: 1px solid rgba(127,127,127,.25); } table.spec small { color: var(--ink2); }
  .hide { display: none !important; } .empty { color: var(--ink2); font-size: 14px; }
  .gate { max-width: 560px; margin: 60px auto; text-align: center; } .gate a { color: var(--acc); font-weight: 800; }
</style>
</head>
<body>
<header>
  <div class="hd"><h1>📖 데이터 압축지도 사용설명서</h1><a href="./">← 지도로</a></div>
  <div class="sr"><input id="q" type="search" placeholder="찾기 — 예: 신호, 사고, 관할, 반려동물, 침수, 매출" autocomplete="off"></div>
  <nav><a href="#about">🌟 이 지도는</a><a href="#how">🚀 쓰는 법</a><a href="#infer">🔎 알아낼 수 있는 것</a><a href="#task">🧭 할 수 있는 일</a><a href="#layer">🗂 레이어 사전</a><a href="#data">📦 자료 목록</a><a href="#spec">📋 제원</a><a href="#make">🛠 어떻게 만들었나</a></nav>
</header>
<main id="main"><p class="empty">설명서를 읽는 중…</p></main>
<script>
(function () {
  var G = null, TAB = null, main = document.getElementById('main'), q = document.getElementById('q');
  function esc(t) { return String(t == null ? '' : t).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function kb(n) { return n >= 1073741824 ? (n / 1073741824).toFixed(1) + 'GB' : n >= 1048576 ? (n / 1048576).toFixed(1) + 'MB' : Math.max(1, Math.round(n / 1024)) + 'KB'; }
  function path(a) { return '<div class="path">' + a.map(function (x, i) { return (i ? '<u>›</u>' : '') + '<i>' + esc(x) + '</i>'; }).join('') + '</div>'; }
  var ok = false; try { ok = localStorage.getItem('tg_map2d_gate') === '1'; } catch (e) {}
  if (!ok) { main.innerHTML = '<div class="gate"><p>이 설명서는 데이터 압축지도를 쓰는 사람을 위한 것이다.</p><p><a href="./">지도에서 확인코드를 넣고 들어온 뒤</a> 🧰 도구 › 📖 사용설명서로 다시 연다.</p></div>'; return; }
  fetch('data/guide.json').then(function (r) { return r.json(); }).then(function (j) { G = j; TAB = G.cats[0][0]; paint(); }).catch(function () { main.innerHTML = '<p class="empty">설명서 자료(data/guide.json)를 읽지 못했다.</p>'; });
  function hit(t, w) { if (!w) return true; t = t.toLowerCase(); return w.split(/\s+/).every(function (x) { return t.indexOf(x) >= 0; }); }
  function paint() {
    var w = (q.value || '').trim().toLowerCase(), h = '';
    var nH = G.n.help, nL = G.n.layers;
    h += '<section id="top"><div class="kpi"><span><b>' + G.tasks.length + '</b><small>할 수 있는 일</small></span><span><b>' + nL + '</b><small>레이어(켜고 끄는 층)</small></span><span><b>' + G.files.length + '</b><small>자료 파일</small></span><span><b>' + G.tools.length + '</b><small>도구</small></span></div><p class="lead">지도 판 ' + esc(G.ver) + ' · 설명서 ' + esc(G.made) + ' · 이 설명서는 지도 코드와 자료 목록에서 저절로 뽑아 만든다(지도와 어긋나지 않게).</p></section>';
    /* 0-0 이 지도만의 특징 · 활용 범위 · 왜 이런 자료까지 (2026-10-18) */
    if (!w && G.about) { var A = G.about, cd = function (t) { return '<div class="card"><h3><span class="ic">' + t[0] + '</span>' + esc(t[1]) + '</h3><p>' + esc(t[2]) + '</p></div>'; };
      h += '<section id="about"><h2>🌟 이 지도는</h2><p class="lead"><b>' + esc(A.lead) + '</b></p><div class="grid">' + A.feat.map(cd).join('') + '</div>'
        + '<h3 class="grp">누가 쓰나 — 활용 범위</h3><div class="grid">' + A.who.map(cd).join('') + '</div>'
        + '<h3 class="grp">왜 이런 자료까지 넣었나</h3><div class="grid">' + A.why.map(cd).join('') + '</div></section>'; }
    /* 0 쓰는 법 · 알아낼 수 있는 것 (2026-10-18) */
    if (!w && G.howto) h += '<section id="how"><h2>🚀 쓰는 법</h2><p class="lead">처음이면 이 차례대로.</p><div class="grid">' + G.howto.map(function (t) { return '<div class="card"><h3><span class="ic">' + esc(t[0]) + '</span>' + esc(t[1]) + '</h3><p>' + esc(t[2]) + '</p></div>'; }).join('') + '</div></section>';
    if (G.infer) { var I = G.infer.filter(function (t) { return hit(t.join(' '), w); }); if (I.length) h += '<section id="infer"><h2>🔎 이 지도로 알아낼 수 있는 것</h2><p class="lead">자료를 겹쳐 보면 숫자 하나로는 안 보이는 것을 어림할 수 있다 — 근거는 카드에 함께 나오고, 판단은 사람이 한다.</p><div class="grid">' + I.map(function (t) { return '<div class="card"><h3><span class="ic">' + t[0] + '</span>' + esc(t[1]) + '</h3><p>' + esc(t[2]) + '</p></div>'; }).join('') + '</div></section>'; }
    /* 1 할 수 있는 일 */
    var T = G.tasks.filter(function (t) { return hit(t.join(' '), w); });
    h += '<section id="task"><h2>🧭 할 수 있는 일</h2><p class="lead">무엇을 알 수 있고 무엇을 할 수 있는지 — 그리고 어디를 누르면 되는지.</p><div class="grid">' + (T.length ? T.map(function (t) { return '<div class="card"><h3><span class="ic">' + t[0] + '</span>' + esc(t[1]) + '</h3><p>' + esc(t[2]) + '</p>' + path(t[3]) + (t[4] ? '<a class="go" href="./#ly=' + encodeURIComponent(t[4]) + '">지도에서 켜 보기 ›</a>' : '') + '</div>'; }).join('') : '<p class="empty">찾는 말이 든 일이 없다.</p>') + '</div></section>';
    /* 2 레이어 사전 */
    h += '<section id="layer"><h2>🗂 레이어 사전</h2><p class="lead">지도의 「레이어」 메뉴와 같은 차례. 레이어마다 무엇을 보여 주고 어떻게 읽는지, 무엇을 알 수 있는지(지도에서 이름 옆 ❓ 와 같은 글). 설명 있음 ' + nH + ' / ' + nL + '.</p>';
    if (!w) h += '<div class="tabs">' + G.cats.map(function (c) { return '<button data-tab="' + c[0] + '" class="' + (c[0] === TAB ? 'on' : '') + '">' + esc(c[1]) + '</button>'; }).join('') + '</div>';
    var seen = {}, any = 0;
    G.cats.forEach(function (c) { if (!w && c[0] !== TAB) return; var hc = '';
      c[2].forEach(function (g) { var hg = '';
        g[2].forEach(function (sb) { var cards = sb[1].map(function (k) { var L = G.layers[k]; if (!L) return ''; var ds = G.help[k] || ''; if (w && (seen[k] || !hit(L.nm + ' ' + ds + ' ' + k, w))) return ''; seen[k] = 1; any++;
            return '<div class="card ly"><h3>' + esc(L.nm) + (L.on ? ' <span class="badge">처음부터 켜짐</span>' : '') + '</h3><p class="ds' + (ds ? '' : ' none') + '">' + (ds ? esc(ds) : '설명 준비 중 — 지도에서 이 레이어를 켜고 점·칸을 누르면 카드에 출처와 값이 나온다') + '</p>' + path(['레이어', c[1], g[1], sb[0]]) + '<a class="go" href="./#ly=' + encodeURIComponent(k) + '">지도에서 켜기 ›</a></div>'; }).join('');
          if (cards) hg += '<div class="sub">' + esc(sb[0]) + '</div><div class="grid">' + cards + '</div>'; });
        if (hg) hc += '<div class="grp">' + esc(g[1]) + '</div>' + hg; });
      if (hc) h += (w ? '<div class="grp" style="font-size:17px">' + esc(c[1]) + '</div>' : '') + hc; });
    if (!any) h += '<p class="empty">찾는 말이 든 레이어가 없다.</p>';
    h += '</section>';
    /* 3-1 제원 (2026-10-18) */
    if (!w && G.spec) { var S = G.spec, Z = S.size, rg = Z.regions || {}, rsum = 0; Object.keys(rg).forEach(function (k) { rsum += rg[k]; });
      h += '<section id="spec"><h2>📋 제원</h2><p class="lead">이 지도 앱의 기본 정보.</p><table class="spec"><tbody>'
        + '<tr><th>이름 · 판</th><td>데이터 압축지도 · 판 ' + esc(G.ver) + ' (설명서 ' + esc(G.made) + ')</td></tr>'
        + '<tr><th>형태</th><td>웹 앱(PWA) — 앱 장터 설치 없이 주소로 연다 · 홈 화면에 추가하면 앱처럼 · 확인코드로 들어온다 · 검색에 걸리지 않게 막아 두었다</td></tr>'
        + '<tr><th>쓸 수 있는 기기</th><td>' + S.platform.map(function (p) { return p[0] + ' <b>' + esc(p[1]) + '</b> — ' + esc(p[2]); }).join('<br>') + '</td></tr>'
        + '<tr><th>총크기</th><td><b>약 ' + kb(Z.total) + '</b> = 지도 사이트 ' + kb(Z.site) + ' + 전국 지역 자료 ' + kb(rsum) + '(권역 저장소 ' + Object.keys(rg).length + '곳) + 바탕 지도 조각 ' + kb(Z.tiles) + '<br><small>한 번에 다 받지 않는다 — 처음 열 때는 지도 코드(약 ' + kb(Z.code) + ')와 바탕만, 나머지는 켠 레이어 · 고른 지역만 그때 받는다. 한 번 받은 것은 기기에 남아 다음엔 빨리 열린다.</small></td></tr>'
        + '<tr><th>범위</th><td>전국 ' + S.sidos + '개 시도(광주·전남 통합) · ' + S.gus + '개 시군구 · 행정동 ' + S.dongs.toLocaleString() + '곳 — 자료마다 범위가 다르다(서울·수도권만 있는 자료가 있다 · 카드와 자료 목록에 적힘)</td></tr>'
        + '<tr><th>담긴 것</th><td>레이어 ' + G.n.layers + '개 · 자료 파일 ' + G.files.length + '개 · 도구 ' + G.tools.length + '개</td></tr>'
        + '<tr><th>통신</th><td>같은 사이트의 자료 파일만 읽는다 · 실시간 층(돌발·소통·날씨 등)은 사용자가 켤 때만 바깥 서비스에 묻는다 · 개인정보를 보내거나 저장하지 않는다 · 통신이 안 되는 곳은 「📥 지역 받기」로 미리 받아 둔다</td></tr>'
        + '<tr><th>업데이트</th><td><b>공공데이터가 올라오는 대로 업데이트된다.</b> ' + esc(S.update) + '</td></tr>'
        + '</tbody></table></section>'; }
    /* 3 자료 목록 */
    var F = G.files.filter(function (f) { return hit(f.f + ' ' + f.s + ' ' + f.k + ' ' + f.n, w); });
    h += '<section id="data"><h2>📦 자료 목록</h2><p class="lead">지도가 읽는 자료 파일 ' + G.files.length + '개 — 파일마다 출처(기관·자료 이름), 칸의 뜻, 한계를 적어 두었다. 눌러서 펼친다.</p>' + (F.length ? F.map(function (f) { return '<details class="file"><summary>' + esc(f.f) + ' <span class="sz">' + kb(f.b) + '</span></summary>' + (f.s ? '<p><b>출처</b><br>' + esc(f.s) + '</p>' : '') + (f.k ? '<p><b>무엇이 들었나(칸)</b><br>' + esc(f.k) + '</p>' : '') + (f.n ? '<p><b>읽을 때 주의</b><br>' + esc(f.n) + '</p>' : '') + '</details>'; }).join('') : '<p class="empty">찾는 말이 든 자료가 없다.</p>') + '</section>';
    /* 4 만든 법 */
    if (!w) h += '<section id="make"><h2>🛠 어떻게 만들었나</h2><p class="lead">공공기관이 공개한 원자료를 받아, 지도가 빨리 읽게 「구워」 같은 사이트에 올린다.</p><div class="flow">'
      + '<div class="st"><b>① 원자료</b><small>공공데이터포털 · 서울 열린데이터광장 · 통계청(KOSIS·SGIS) · 국세청 · 경찰청(UTIC) · 도로교통공단(TAAS) · 지방행정 인허가 등 — 자료마다 출처를 적는다</small></div><div class="ar">→</div>'
      + '<div class="st"><b>② 받기</b><small>업무 PC 에서 받는다 · 열쇠(인증키)는 그 PC 에만 두고 지도에 넣지 않는다</small></div><div class="ar">→</div>'
      + '<div class="st"><b>③ 굽기</b><small>자료마다 굽는 도구가 칸을 고르고 묶는다 · 지어낸 값은 넣지 않는다 · 개인정보는 받는 자리에서 버린다 · 추정은 추정이라고 적는다</small></div><div class="ar">→</div>'
      + '<div class="st"><b>④ 자료 파일</b><small>파일 맨 위에 출처 · 칸의 뜻 · 기준일 · 주의를 적는다(위 자료 목록)</small></div><div class="ar">→</div>'
      + '<div class="st"><b>⑤ 지도</b><small>같은 사이트 파일만 읽는다 · 실시간 층은 사용자가 켤 때만 바깥에 묻는다 · 올리기 전에 값 검사 관문을 통과해야 한다</small></div></div>'
      + '<ul class="rule"><li>시군구 단위 통계(세금·업종 등)는 동으로 나누지 않는다 — 「동네 차이는 반영 안 됨」</li><li>받은 날·기준일이 지난 자료는 정해진 주기에 다시 굽는다(자료 점검표)</li><li>법령·판례는 T-Book 이 정본이고, 이 지도는 자료를 겹쳐 보는 도구다</li><li>틀린 곳을 찾으면 지도 맨 아래 「자료 출처·한계」와 함께 알려 주면 고친다</li></ul></section>';
    main.innerHTML = h;
  }
  main.addEventListener('click', function (e) { var b = e.target.closest('[data-tab]'); if (!b) return; TAB = b.getAttribute('data-tab'); paint(); document.getElementById('layer').scrollIntoView(); });
  var tm = 0; q.addEventListener('input', function () { clearTimeout(tm); tm = setTimeout(paint, 180); });
})();
</script>
</body>
</html>
