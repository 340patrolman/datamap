<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><title>온톨로지 코어 시험</title></head>
<body>
<pre id="out">돌리는 중…</pre>
<script src="../query.js"></script>
<script src="../validate.js"></script>
<script>
/* 온톨로지 코어 v1 시험 페이지 — run.py 가 머리 없는 크롬으로 열어 window.__R 을 읽고, 원자료에서 따로 센 정답과 맞댄다 */
Promise.all([fetch('../data/core-seocho.json').then(function (r) { return r.json(); }), fetch('../schema-ext.json').then(function (r) { return r.json(); })]).then(function (x) {
  var core = x[0], schema = x[1], o = new OntoCore(core), S = ['INT-521', 'INT-548', 'INT-1026'], R = { validate: ontoValidate(core, schema), q1: {}, q2: {}, q3: {}, q5: {} };
  S.forEach(function (i) { R.q1[i] = o.q1(i); R.q2[i] = o.q2(i); R.q5[i] = o.q5(i); });
  ['VIO-02', 'VIO-05', 'VIO-06'].forEach(function (v) { R.q3[v] = o.q3(v); });
  /* 검증기가 결함을 정말 잡는지 — 일부러 망가뜨린 사본(고아 링크 · 타입 위반 · 필수 속성 누락 · ID 중복 · 차량번호 꼴) */
  var bad = JSON.parse(JSON.stringify(core)); bad.edges.push(['INT-521', '발생', 'ACC-없는것', { g: 'C', src: '시험' }]); bad.edges.push(['INT-521', '근거', 'LAW-T0', { g: 'C', src: '시험' }]);
  bad.objects.push({ id: 'INT-999999', t: 'INT', nm: '시험' }); bad.objects.push(JSON.parse(JSON.stringify(bad.objects[0]))); bad.objects.push({ id: 'REC-시험', t: 'REC', text: '12가 3456 차가 지나감' });
  bad.objects.push({ id: 'RULE-X-9', t: 'RULE', d: '정의만', g: 'C' }); bad.edges.push(['FK-BANPO-1', '뒷받침', 'INT-521', { g: 'B', src: '시험' }]);
  R.negative = ontoValidate(bad, schema);
  /* 질문 6 — 규칙·현장 판단(장부 그대로) */
  R.rules = o.rules(); R.rulesSig = o.rules('신호'); R.why = {}; o.rules().forEach(function (r) { R.why[r.id] = o.why(r.id); }); R.whyBad = o.why('INT-521');
  /* 질문 5 「주 위반이 같다」 목록의 실제 주 위반 */
  R.q5mv = {}; S.forEach(function (i) { R.q5mv[i] = (R.q5[i].dims.mainv.list || []).map(function (x) { var q = o.q1(x.id); return q.mainViolations[0] ? q.mainViolations[0].id : null; }); R.q5mv[i + '_me'] = R.q1[i].mainViolations[0] ? R.q1[i].mainViolations[0].id : null; });
  /* 질문 7 — 행정동(2026-10-23) · 서초3동 · 방배본동(일부 번지 관할) · 반포4동(두 서) */
  R.q7 = {}; ['DNG-11650530', 'DNG-11650590', 'DNG-11650581'].forEach(function (d) { R.q7[d] = o.q7(d, 100); }); R.q7bad = o.q7('INT-521');
  window.__R = R; document.getElementById('out').textContent = JSON.stringify(R, null, 1).slice(0, 4000);
}).catch(function (e) { window.__R = { error: String(e) }; });
</script>
</body></html>
